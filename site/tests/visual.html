<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridGraph visual review — synthetic data</title>
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="../graph.css">
  <script src="../GridGraph.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html">Executive<span class="brand-number">51</span></a><p>Temporary visual review</p></div></header>
  <main id="main"><section class="resume-section"><div class="container"><div class="section-grid"><div class="section-index">Synthetic fixture</div><div class="section-content">
    <h1>GridGraph visual review</h1>
    <p>This temporary review page uses fabricated rows only. It does not connect to any data provider.</p>
    <div class="graph-panel"><h2>Graph panel</h2><div class="graph-controls"><button id="load-fixture" type="button">Load synthetic rows</button></div><p id="review-status" role="status">Select the button to load the local fixture and Plotly.</p><grid-graph></grid-graph></div>
  </div></div></div></section></main>
  <script>
    const fixture = { columns: ["Month", "Population", "CPI", "Unemployment"], rows: [["Jan", "1030", "121.2", "5.4%"], ["Feb", "1045", "121.8", ""], ["Mar", "", "122.1", "5.1%"], ["Apr", "1080", "122.4", "4.9%"]] };
    const button = document.querySelector("#load-fixture");
    const status = document.querySelector("#review-status");
    const graph = document.querySelector("grid-graph");
    button.addEventListener("click", () => {
      button.disabled = true;
      status.textContent = "Loading the approved Plotly library for this visual review…";
      const script = document.createElement("script");
      script.src = "https://cdn.plot.ly/plotly-4.1.1.min.js";
      script.crossOrigin = "anonymous";
      script.referrerPolicy = "no-referrer";
      script.onload = () => { graph.data = fixture; status.textContent = "Synthetic rows loaded. Select each graph mode to review its rendering."; };
      script.onerror = () => { status.textContent = "Plotly could not be loaded for the visual review."; button.disabled = false; };
      document.head.append(script);
    }, { once: true });
  </script>
</body>
</html>
